# Secret Pattern Detection Rules
rules:
  - id: "SEC-001"
    name: "OpenAI API Key"
    severity: HIGH
    cwe: "CWE-798"
    pattern: 'sk-[a-zA-Z0-9]{48}'
    description: "OpenAI API key pattern"

  - id: "SEC-002"
    name: "GitHub Personal Access Token"
    severity: HIGH
    cwe: "CWE-798"
    pattern: 'ghp_[a-zA-Z0-9]{36}'
    description: "GitHub classic PAT"

  - id: "SEC-003"
    name: "GitHub OAuth Token"
    severity: HIGH
    cwe: "CWE-798"
    pattern: 'gho_[a-zA-Z0-9]{36}'
    description: "GitHub OAuth access token"

  - id: "SEC-004"
    name: "AWS Access Key ID"
    severity: HIGH
    cwe: "CWE-798"
    pattern: 'AKIA[0-9A-Z]{16}'
    description: "AWS IAM access key"

  - id: "SEC-005"
    name: "Generic API Key Assignment"
    severity: MEDIUM
    cwe: "CWE-798"
    pattern: '(?i)(api[_-]?key|apikey)\s*=\s*["\''][^"\'']{16,}["\'']'
    description: "Generic API key hardcoded in source"

  - id: "SEC-006"
    name: "JWT Secret Hardcoded"
    severity: HIGH
    cwe: "CWE-798"
    pattern: '(?i)(jwt[_-]?secret|secret[_-]?key)\s*=\s*["\''][^"\'']{8,}["\'']'
    description: "JWT signing secret hardcoded in source"

  - id: "SEC-007"
    name: "Database Connection String"
    severity: HIGH
    cwe: "CWE-798"
    pattern: '(?i)(database[_-]?url|db[_-]?url|connection[_-]?string)\s*=\s*["\''][^"\'']*://[^"\'']+["\'']'
    description: "Database credentials in connection string"

  - id: "SEC-008"
    name: "Private Key Header"
    severity: CRITICAL
    cwe: "CWE-798"
    pattern: '-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
    description: "Private key material in source code"
